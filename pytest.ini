[pytest]
# Pytest configuration for G.O.A.T

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-exclude=tests/*

# Coverage settings
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    */site-packages/*
    setup.py
    gunicorn_config.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
